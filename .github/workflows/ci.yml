name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aidlc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # AI-DLC policy-as-code: artifact IDs, traceability links, AC->test coverage,
      # generated plugin-payload and persona-surface drift, framework-lock integrity.
      # Required status for merge — this is what makes the gates governance, not guidance.
      - run: node tools/aidlc-check.mjs
