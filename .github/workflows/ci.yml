name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aidlc-check:
    runs-on: ubuntu-latest
    steps:
      # Full history: the Gate D1 plan-tamper check verifies approved plan
      # commits with `git show`, which a shallow clone can never reach.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # AI-DLC policy-as-code: artifact IDs, traceability links, AC->test coverage,
      # generated plugin-payload and persona-surface drift, framework-lock integrity.
      # Required status for merge — this is what makes the gates governance, not guidance.
      - run: node tools/aidlc-check.mjs
      # Self-checks for the tools themselves — today: that --update refreshes the
      # framework without overwriting anything an adopting team owns.
      - run: npm test

  # Regression coverage for Windows installs: path.relative returns backslash
  # paths on win32, which once broke every framework-lock lookup during scaffold.
  # The scaffold test runs the full scaffold -> check flow, so it fails here if
  # any path comparison stops being separator-safe.
  tools-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
